name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'ai-agent/**'
  pull_request:
    branches:
      - main

jobs:
  lint-and-validate:
    name: Lint & Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest pytest-cov

      - name: Syntax Compilation Check
        run: |
          python -m compileall app

      - name: Run Ruff Linter
        run: |
          ruff check app --select=E9,F63,F7,F82 --ignore=F401,F841 || true

  test:
    name: Pytest Automated Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx

      - name: Run Automated Pytest Suite
        env:
          WORKSPACE_BASE_DIR: "generated_projects"
          LOG_LEVEL: "INFO"
        run: |
          python -m pytest -v --tb=short
